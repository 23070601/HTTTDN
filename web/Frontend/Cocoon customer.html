<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cocoon Vietnam — Skincare Thuần Chay</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf7f1;--bg2:#f5f0e8;--bg3:#ede8de;
  --fg:#2a3d2b;--fg2:#4a5e4a;--muted:#8a8070;
  --border:#ddd8cc;--border2:#ccc5b5;
  --surface:#f0ebe0;--surface2:#e8e3d8;
  --primary:#2d5016;--primary2:#3a6b1e;--primary-fg:#fff;
  --accent:#6b8c2a;--accent-soft:#eaf2d0;--accent-fg:#fff;
  --gold:#b8890a;--gold-soft:#fef5d8;
  --danger:#c0392b;--danger-soft:#fde8e6;
  --warning:#d4820a;--warning-soft:#fef3e2;
  --success:#2d6a2d;--success-soft:#e5f4e5;
  --info:#1a5c8a;--info-soft:#e3f0fb;
  --card:#fcf9f3;--card-border:#e2dcd0;
  --font:'DM Sans',sans-serif;--font-d:'Lora',serif;
  --r:10px;--r-sm:6px;--r-lg:18px;--r-xl:28px;
  --sh:0 1px 3px rgba(0,0,0,.05),0 1px 2px rgba(0,0,0,.04);
  --sh-md:0 4px 16px rgba(0,0,0,.08);--sh-lg:0 16px 48px rgba(0,0,0,.12);
  --max:1200px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--bg);color:var(--fg);font-size:14px;line-height:1.6;}
a{color:var(--accent);text-decoration:none;}
img{max-width:100%;height:auto;}

/* HEADER */
#header{background:rgba(252,249,243,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:200;box-shadow:var(--sh);}
.h-inner{max-width:var(--max);margin:0 auto;padding:0 24px;height:62px;display:flex;align-items:center;gap:20px;}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer;text-decoration:none;}
.logo-mark{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.logo-name{font-family:var(--font-d);font-size:17px;color:var(--fg);font-weight:600;}
.h-nav{display:flex;gap:2px;flex:1;}
.hn{padding:7px 13px;border-radius:var(--r-sm);font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;transition:all .15s;}
.hn:hover,.hn.on{background:var(--accent-soft);color:var(--primary);}
.h-right{display:flex;align-items:center;gap:8px;margin-left:auto;}
.cart-btn{position:relative;width:38px;height:38px;border-radius:var(--r-sm);background:var(--accent-soft);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--primary);border:none;transition:background .15s;}
.cart-btn:hover{background:var(--bg3);}
.cart-cnt{position:absolute;top:-3px;right:-3px;width:17px;height:17px;background:var(--danger);border-radius:50%;font-size:9px;font-weight:700;color:#fff;display:none;align-items:center;justify-content:center;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 15px;border-radius:var(--r-sm);font-family:var(--font);font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all .15s;white-space:nowrap;}
.btn-p{background:var(--primary);color:#fff;}.btn-p:hover{background:var(--primary2);}
.btn-a{background:var(--accent);color:#fff;}.btn-a:hover{background:#5a7a20;}
.btn-o{background:transparent;color:var(--primary);border:1.5px solid var(--primary);}.btn-o:hover{background:var(--accent-soft);}
.btn-g{background:var(--surface);color:var(--fg);border:1px solid var(--border);}.btn-g:hover{background:var(--surface2);}
.btn-sm{padding:6px 12px;font-size:12px;}.btn-xs{padding:4px 9px;font-size:11px;}
.btn-full{width:100%;justify-content:center;padding:13px;}

/* MAIN */
#main{max-width:var(--max);margin:0 auto;padding:28px 24px;}

/* HERO */
.hero{background:linear-gradient(130deg,var(--primary) 0%,#3a7020 50%,var(--accent) 100%);border-radius:var(--r-xl);padding:52px 48px;color:#fff;margin-bottom:40px;position:relative;overflow:hidden;}
.hero::after{content:'';position:absolute;right:-20px;top:-20px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.05);}
.hero::before{content:'🌿';position:absolute;right:48px;top:50%;transform:translateY(-50%);font-size:100px;opacity:.15;z-index:0;}
.hero-content{position:relative;z-index:1;}
.hero h1{font-family:var(--font-d);font-size:34px;line-height:1.25;margin-bottom:12px;font-weight:700;}
.hero p{font-size:15px;opacity:.85;margin-bottom:24px;max-width:460px;line-height:1.7;}
.hero-btns{display:flex;gap:10px;flex-wrap:wrap;}
.hero-btn{padding:12px 24px;border-radius:var(--r-sm);font-family:var(--font);font-weight:600;cursor:pointer;border:none;font-size:14px;transition:all .15s;}
.hero-btn-w{background:#fff;color:var(--primary);}.hero-btn-w:hover{background:#f0f8f0;}
.hero-btn-t{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.5);}.hero-btn-t:hover{background:rgba(255,255,255,.1);}
.hero-badges{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;}
.hero-badge{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);padding:4px 12px;border-radius:20px;font-size:12px;display:flex;align-items:center;gap:5px;}

/* CATEGORIES STRIP */
.cat-strip{display:flex;gap:8px;margin-bottom:28px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;}
.cat-strip::-webkit-scrollbar{display:none;}
.cat-chip{padding:7px 16px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:var(--card);color:var(--muted);white-space:nowrap;transition:all .15s;}
.cat-chip:hover{border-color:var(--accent);color:var(--accent);}
.cat-chip.on{background:var(--accent);color:#fff;border-color:var(--accent);}

/* PRODUCT GRID */
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.section-title{font-family:var(--font-d);font-size:20px;font-weight:600;}
.prod-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:36px;}
@media(max-width:1024px){.prod-grid{grid-template-columns:repeat(3,1fr);}}
@media(max-width:680px){.prod-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:420px){.prod-grid{grid-template-columns:1fr;}}
.prod-card{background:var(--card);border:1px solid var(--card-border);border-radius:var(--r);overflow:hidden;transition:transform .2s,box-shadow .2s;cursor:pointer;}
.prod-card:hover{transform:translateY(-2px);box-shadow:var(--sh-md);}
.prod-img{height:190px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:52px;position:relative;overflow:hidden;}
.prod-img img{width:100%;height:100%;object-fit:cover;}
.prod-img-placeholder{font-size:52px;}
.prod-badge-wrap{position:absolute;top:8px;left:8px;display:flex;flex-direction:column;gap:4px;}
.prod-badge{padding:2px 7px;border-radius:20px;font-size:10px;font-weight:700;}
.pb-new{background:#fff;color:var(--accent);}
.pb-hot{background:var(--danger);color:#fff;}
.pb-sale{background:var(--gold);color:#fff;}
.prod-body{padding:14px;}
.prod-cat{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}
.prod-name{font-family:var(--font-d);font-size:13px;line-height:1.4;margin-bottom:8px;min-height:38px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.prod-ingredients{font-size:11px;color:var(--muted);margin-bottom:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.prod-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.prod-price{font-size:15px;font-weight:700;color:var(--primary);}
.prod-stock{font-size:11px;color:var(--muted);}
.add-btn{width:32px;height:32px;border-radius:var(--r-sm);background:var(--primary);color:#fff;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;flex-shrink:0;transition:background .15s;}
.add-btn:hover{background:var(--primary2);}
.add-btn:disabled{background:var(--border);color:var(--muted);cursor:not-allowed;}

/* FILTER BAR */
.filter-bar{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;align-items:center;}
.sb{position:relative;flex:1;min-width:180px;}
.sb svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted);width:13px;height:13px;}
.sb input{padding-left:29px;}
input,select{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--bg);color:var(--fg);font-family:var(--font);font-size:13px;outline:none;transition:border-color .15s,box-shadow .15s;}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(107,140,42,.12);}
.fsel{width:auto;min-width:110px;flex-shrink:0;}

/* CART DRAWER */
#cart-drawer{position:fixed;right:0;top:0;width:380px;height:100vh;background:var(--card);border-left:1px solid var(--border);z-index:300;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);box-shadow:-8px 0 40px rgba(0,0,0,.1);}
#cart-drawer.open{transform:none;}
.cart-overlay{position:fixed;inset:0;background:rgba(30,48,16,.3);z-index:299;display:none;backdrop-filter:blur(2px);}
.cart-overlay.open{display:block;}
.cd-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.cd-title{font-family:var(--font-d);font-size:17px;font-weight:600;}
.cd-close{width:30px;height:30px;border:1px solid var(--border);border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;cursor:pointer;background:transparent;color:var(--muted);font-size:16px;}
.cd-body{flex:1;overflow-y:auto;padding:14px;}
.ci{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
.ci:last-child{border-bottom:none;}
.ci-img{width:62px;height:62px;border-radius:var(--r-sm);background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;overflow:hidden;}
.ci-img img{width:100%;height:100%;object-fit:cover;}
.ci-info{flex:1;min-width:0;}
.ci-name{font-size:13px;font-weight:500;line-height:1.3;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ci-price{font-size:13px;color:var(--primary);font-weight:600;}
.qty-ctrl{display:flex;align-items:center;gap:6px;margin-top:6px;}
.qty-btn{width:24px;height:24px;border-radius:4px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;color:var(--fg);transition:background .1s;}
.qty-btn:hover{background:var(--surface2);}
.qty-v{font-size:13px;min-width:24px;text-align:center;}
.rm-btn{margin-left:auto;color:var(--muted);cursor:pointer;font-size:16px;transition:color .15s;}
.rm-btn:hover{color:var(--danger);}
.cd-foot{padding:16px 20px;border-top:1px solid var(--border);background:var(--surface);}
.cart-summary{margin-bottom:14px;}
.cs-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;}
.cs-row.total{font-weight:700;font-size:15px;color:var(--primary);}
.loyalty-apply{background:var(--gold-soft);border:1px solid #f0d878;border-radius:var(--r-sm);padding:10px 12px;margin-bottom:10px;display:none;}
.loyalty-apply.show{display:block;}

/* PAGINATION */
.pager{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:28px;}
.pg{width:34px;height:34px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--bg);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;color:var(--fg);transition:all .15s;}
.pg:hover{background:var(--accent-soft);color:var(--primary);}
.pg.on{background:var(--primary);color:#fff;border-color:var(--primary);}

/* MODAL */
.modal-bd{position:fixed;inset:0;background:rgba(30,48,16,.4);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px);}
.modal{background:var(--card);border-radius:var(--r-lg);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;box-shadow:var(--sh-lg);}
.modal.md{max-width:620px;}
.modal-hd{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--card);z-index:1;}
.modal-title{font-family:var(--font-d);font-size:16px;font-weight:600;}
.modal-close{width:28px;height:28px;border-radius:var(--r-sm);border:1px solid var(--border);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);}
.modal-body{padding:20px 22px;}
.modal-ft{padding:14px 22px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;background:var(--surface);border-radius:0 0 var(--r-lg) var(--r-lg);}

/* PRODUCT DETAIL MODAL */
.pd-img{height:220px;background:var(--accent-soft);border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-size:70px;margin-bottom:16px;overflow:hidden;}
.pd-img img{width:100%;height:100%;object-fit:cover;}
.pd-price{font-size:26px;font-weight:700;color:var(--primary);font-family:var(--font-d);}
.pd-ingr{background:var(--surface);border-radius:var(--r-sm);padding:12px 14px;font-size:12px;color:var(--muted);line-height:1.7;margin:12px 0;}
.pd-qty-row{display:flex;align-items:center;gap:12px;margin:14px 0;}

/* AUTH TABS */
.auth-tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:18px;}
.auth-tab{padding:9px 20px;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;}
.auth-tab.on{color:var(--primary);border-bottom-color:var(--primary);}
.fg{margin-bottom:13px;}
.fg label{display:block;font-size:12px;font-weight:600;color:var(--fg2);text-transform:uppercase;letter-spacing:.03em;margin-bottom:5px;}
.fg-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.err-msg{background:var(--danger-soft);color:var(--danger);border-left:3px solid var(--danger);padding:10px 13px;border-radius:var(--r-sm);font-size:13px;margin-bottom:12px;display:none;}
.soc-divider{text-align:center;color:var(--muted);font-size:12px;margin:12px 0;position:relative;}
.soc-divider::before,.soc-divider::after{content:'';position:absolute;top:50%;width:42%;height:1px;background:var(--border);}
.soc-divider::before{left:0;}.soc-divider::after{right:0;}

/* CHECKOUT */
.co-grid{display:grid;grid-template-columns:1fr 340px;gap:24px;align-items:start;}
@media(max-width:768px){.co-grid{grid-template-columns:1fr;}}
.co-section{background:var(--card);border:1px solid var(--card-border);border-radius:var(--r);padding:20px;margin-bottom:14px;}
.co-section-title{font-family:var(--font-d);font-size:15px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.co-step-num{width:22px;height:22px;border-radius:50%;background:var(--primary);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.pm-options{display:flex;flex-direction:column;gap:8px;}
.pm-option{display:flex;align-items:center;gap:10px;padding:11px 13px;border:1.5px solid var(--border);border-radius:var(--r-sm);cursor:pointer;transition:all .15s;}
.pm-option.selected,.pm-option:hover{border-color:var(--accent);background:var(--accent-soft);}
.pm-option input[type=radio]{accent-color:var(--accent);}
.pm-icon{font-size:20px;width:28px;text-align:center;}
.co-summary{background:var(--card);border:1px solid var(--card-border);border-radius:var(--r);padding:20px;position:sticky;top:76px;}
.cs-prod-list{margin-bottom:14px;}
.cs-prod-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px;}
.cs-prod-img{width:36px;height:36px;border-radius:var(--r-sm);background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;overflow:hidden;}
.cs-prod-img img{width:100%;height:100%;object-fit:cover;}

/* ORDERS PAGE */
.ord-card{background:var(--card);border:1px solid var(--card-border);border-radius:var(--r);padding:16px 18px;margin-bottom:10px;transition:box-shadow .15s;}
.ord-card:hover{box-shadow:var(--sh);}
.ord-hd{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap;}
.ord-num{font-family:var(--font-d);font-size:14px;font-weight:600;}
.badge{display:inline-flex;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;}
.b-g{background:var(--success-soft);color:var(--success);}
.b-r{background:var(--danger-soft);color:var(--danger);}
.b-y{background:var(--warning-soft);color:var(--warning);}
.b-b{background:var(--info-soft);color:var(--info);}
.b-n{background:var(--surface2);color:var(--muted);}
.b-gold{background:var(--gold-soft);color:var(--gold);}
.ord-items{font-size:12px;color:var(--muted);margin-bottom:8px;}
.ord-ft{display:flex;align-items:center;justify-content:space-between;}
.ord-total{font-weight:700;font-size:15px;color:var(--primary);}

/* LOYALTY */
.loy-card{background:linear-gradient(130deg,var(--primary),var(--accent));border-radius:var(--r-lg);padding:28px 32px;color:#fff;margin-bottom:20px;}
.loy-pts{font-family:var(--font-d);font-size:44px;font-weight:700;margin:6px 0;}
.loy-tier{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.2);padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;margin-top:4px;}
.tier-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px;}
@media(max-width:680px){.tier-cards{grid-template-columns:repeat(2,1fr);}}
.tier-card{background:var(--card);border:1.5px solid var(--card-border);border-radius:var(--r);padding:14px;text-align:center;}
.tier-card.current{border-color:var(--gold);background:var(--gold-soft);}
.tier-name{font-weight:700;font-size:13px;margin-bottom:4px;}
.tier-req{font-size:11px;color:var(--muted);margin-bottom:6px;}
.pts-bar{background:var(--surface2);border-radius:20px;height:7px;overflow:hidden;margin:6px 0;}
.pts-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:20px;transition:width .5s ease;}

/* PROFILE */
.pf-av{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-size:26px;color:#fff;font-weight:700;margin:0 auto 14px;}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.ii label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:3px;}
.ii span{font-size:13px;}

/* TRACK ORDER */
.track-wrap{max-width:480px;margin:0 auto;text-align:center;padding:40px 0;}
.track-steps{display:flex;align-items:center;margin:20px 0;}
.ts{display:flex;align-items:center;gap:6px;}
.ts-dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--muted);flex-shrink:0;}
.ts-dot.done{background:var(--success);border-color:var(--success);color:#fff;}
.ts-dot.cur{background:var(--primary);border-color:var(--primary);color:#fff;}
.ts-label{font-size:11px;color:var(--muted);}
.ts-label.cur{color:var(--primary);font-weight:600;}
.ts-line{flex:1;height:2px;background:var(--border);margin:0 5px;}
.ts-line.done{background:var(--success);}

/* TOAST */
#toasts{position:fixed;bottom:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;}
.toast{display:flex;align-items:center;gap:8px;padding:11px 15px;border-radius:var(--r);font-size:13px;font-weight:500;box-shadow:var(--sh-md);animation:tsIn .25s ease;max-width:320px;}
.ts-s{background:var(--success);color:#fff;}
.ts-e{background:var(--danger);color:#fff;}
.ts-w{background:var(--warning);color:#fff;}
.ts-i{background:var(--info);color:#fff;}
@keyframes tsIn{from{opacity:0;transform:translateX(16px);}to{opacity:1;transform:none;}}

/* LOADING */
.loading{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--muted);}
.spin{width:26px;height:26px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .75s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.empty{text-align:center;padding:60px 24px;color:var(--muted);}
.empty-icon{font-size:40px;margin-bottom:12px;display:block;}

/* ALERT */
.alert{padding:11px 14px;border-radius:var(--r-sm);font-size:13px;border-left:3px solid;}
.al-i{background:var(--info-soft);color:var(--info);border-color:var(--info);}
.al-s{background:var(--success-soft);color:var(--success);border-color:var(--success);}
.al-w{background:var(--warning-soft);color:var(--warning);border-color:var(--warning);}
.al-d{background:var(--danger-soft);color:var(--danger);border-color:var(--danger);}

/* MISC */
.fw6{font-weight:600;}
.text-muted{color:var(--muted);}
hr{border:none;border-top:1px solid var(--border);margin:14px 0;}
@media(max-width:600px){
  #main{padding:16px;}
  .hero{padding:28px 20px;}
  .hero h1{font-size:24px;}
  .h-nav{display:none;}
}
</style>
</head>
<body>

<!-- HEADER -->
<header id="header">
  <div class="h-inner">
    <a class="logo" onclick="goPage('home')">
      <div class="logo-mark">🌿</div>
      <span class="logo-name">Cocoon Vietnam</span>
    </a>
    <nav class="h-nav">
      <span class="hn on" data-page="home">Trang chủ</span>
      <span class="hn" data-page="catalog">Sản phẩm</span>
      <span class="hn" data-page="orders">Đơn hàng</span>
      <span class="hn" data-page="loyalty">Loyalty</span>
    </nav>
    <div class="h-right">
      <button class="cart-btn" onclick="toggleCart()" title="Giỏ hàng">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <span class="cart-cnt" id="cart-cnt">0</span>

      <!-- Guest state -->
      <div id="guest-area">

        <button class="btn btn-p btn-sm" onclick="openAuth('register')">Đăng ký</button>
      </div>
      <!-- Logged in state -->
      <div id="user-area" style="display:none;align-items:center;gap:8px">
        <div onclick="goPage('profile')" style="display:flex;align-items:center;gap:7px;cursor:pointer;padding:5px 10px;border-radius:var(--r-sm);transition:background .15s" onmouseover="this.style.background='var(--accent-soft)'" onmouseout="this.style.background='transparent'">
          <div id="u-av" style="width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff">?</div>
          <span id="u-name" style="font-size:13px;font-weight:500">...</span>
        </div>
        <button class="btn btn-g btn-sm" onclick="doLogout()">Đăng xuất</button>
      </div>
    </div>
  </div>
</header>

<!-- CART OVERLAY -->
<div class="cart-overlay" id="cart-overlay" onclick="toggleCart()"></div>

<!-- CART DRAWER -->
<div id="cart-drawer">
  <div class="cd-head">
    <div class="cd-title">🛒 Giỏ hàng (<span id="cart-count-label">0</span>)</div>
    <button class="cd-close" onclick="toggleCart()">✕</button>
  </div>
  <div class="cd-body" id="cart-body">
    <div class="empty"><span class="empty-icon">🛒</span>Giỏ hàng trống</div>
  </div>
  <div class="cd-foot">
    <div id="loyalty-apply-section" class="loyalty-apply">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
        <span style="font-size:12px;font-weight:600;color:var(--gold)">⭐ Dùng điểm loyalty</span>
        <span id="pts-avail" style="font-size:11px;color:var(--muted)"></span>
      </div>
      <div style="display:flex;gap:6px">
        <input type="number" id="pts-use" placeholder="Số điểm muốn dùng" min="0" style="flex:1;font-size:12px">
        <button class="btn btn-g btn-sm" onclick="applyLoyalty()">Áp dụng</button>
      </div>
      <div id="pts-discount-info" style="font-size:11px;color:var(--success);margin-top:4px"></div>
    </div>
    <div class="cart-summary">
      <div class="cs-row"><span>Tạm tính</span><span id="cs-sub">0 ₫</span></div>
      <div class="cs-row"><span>Phí vận chuyển</span><span id="cs-ship">30.000 ₫</span></div>
      <div id="cs-discount-row" class="cs-row" style="display:none;color:var(--success)">
        <span>Giảm loyalty</span><span id="cs-discount">0 ₫</span>
      </div>
      <hr style="margin:10px 0">
      <div class="cs-row total"><span>Tổng cộng</span><span id="cs-total">0 ₫</span></div>
    </div>
    <button class="btn btn-p btn-full" onclick="goCheckout()">Thanh toán →</button>
    <div style="text-align:center;margin-top:8px;font-size:11px;color:var(--muted)">🔒 Thanh toán bảo mật</div>
  </div>
</div>

<!-- MAIN CONTENT -->
<main id="main">
  <div class="loading"><div class="spin"></div></div>
</main>

<!-- MODAL -->
<div class="modal-bd" id="modal" style="display:none" onclick="closeMBg(event)">
  <div class="modal" id="modal-box" onclick="event.stopPropagation()">
    <div class="modal-hd">
      <div class="modal-title" id="modal-title"></div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-ft" id="modal-ft" style="display:none"></div>
  </div>
</div>

<div id="toasts"></div>

<script>
// ═══════════════════════════════════════════════════════════
//  CONFIG & STATE
// ═══════════════════════════════════════════════════════════
const API_BASE = 'http://localhost:3000'; // adjust if needed
let token  = localStorage.getItem('cocoon_sf_token');
let me     = null;   // { user_id, customer_id, full_name, email, role }
let custId = null;   // resolved customer_id for loyalty etc.
let cart   = JSON.parse(localStorage.getItem('cocoon_sf_cart') || '[]');
let loyaltyPtsToUse = 0;
const SHIP_FEE = 30000;

// ═══════════════════════════════════════════════════════════
//  API
// ═══════════════════════════════════════════════════════════
async function apiFetch(path, opts = {}) {
  const h = { 'Content-Type': 'application/json' };
  if (token) h['Authorization'] = `Bearer ${token}`;
  try {
    const r = await fetch(`${API_BASE}/api${path}`, { ...opts, headers: { ...h, ...(opts.headers || {}) } });
    const d = await r.json();
    return { ok: r.ok, status: r.status, data: d };
  } catch(e) {
    return null;
  }
}
const G   = (p, q = {}) => { const qs = new URLSearchParams(q).toString(); return apiFetch(p + (qs ? '?' + qs : '')); };
const Po  = (p, b)       => apiFetch(p, { method: 'POST',  body: JSON.stringify(b) });
const Pu  = (p, b)       => apiFetch(p, { method: 'PUT',   body: JSON.stringify(b) });

// ═══════════════════════════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════════════════════════
function toast(msg, type = 's') {
  const cls = { s: 'ts-s', e: 'ts-e', w: 'ts-w', i: 'ts-i' }[type] || 'ts-i';
  const el = document.createElement('div');
  el.className = `toast ${cls}`;
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), 3500);
}
const VND  = n  => n == null ? '—' : Number(n).toLocaleString('vi-VN') + ' ₫';
const N    = n  => n == null ? '—' : Number(n).toLocaleString('vi-VN');
const FD   = d  => d ? new Date(d).toLocaleDateString('vi-VN') : '—';
const FDT  = d  => d ? new Date(d).toLocaleString('vi-VN') : '—';
const INI  = n  => n ? n.split(' ').slice(-2).map(w => w[0]).join('').toUpperCase() : '?';

function setMain(h)  { document.getElementById('main').innerHTML = h; }
function openModal(title, body, footer = '', size = '') {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = body;
  const ft = document.getElementById('modal-ft');
  ft.innerHTML = footer; ft.style.display = footer ? 'flex' : 'none';
  document.getElementById('modal-box').className = `modal${size ? ' ' + size : ''}`;
  document.getElementById('modal').style.display = 'flex';
}
function closeModal() { document.getElementById('modal').style.display = 'none'; }
function closeMBg(e) { if (e.target === document.getElementById('modal')) closeModal(); }

function pgHTML(pag, fn) {
  if (!pag || pag.pages <= 1) return '';
  const { page, pages } = pag;
  let s = '';
  for (let i = 1; i <= pages; i++) {
    if (i === 1 || i === pages || Math.abs(i - page) <= 2)
      s += `<button class="pg ${i === page ? 'on' : ''}" onclick="${fn}(${i})">${i}</button>`;
    else if (Math.abs(i - page) === 3) s += `<span style="color:var(--muted)">…</span>`;
  }
  return `<div class="pager">${s}</div>`;
}

function productImg(p) {
  // tags field stores image as "img:<url>" per admin convention
  if (p.tags && p.tags.startsWith('img:')) {
    const url = p.tags.slice(4).split('|')[0];
    return `<img src="${url}" loading="lazy" onerror="this.parentElement.innerHTML='<span class=prod-img-placeholder>${pEmoji(p)}</span>'">`;
  }
  return `<span class="prod-img-placeholder">${pEmoji(p)}</span>`;
}
function pEmoji(p) {
  if (!p) return '🌿';
  const n = (p.product_name || '').toLowerCase();
  if (n.includes('cà phê') || n.includes('coffee')) return '☕';
  if (n.includes('dầu') || n.includes('oil')) return '💧';
  if (n.includes('kem') || n.includes('cream')) return '🧴';
  if (n.includes('son') || n.includes('lip')) return '💄';
  if (n.includes('tóc') || n.includes('hair')) return '💆';
  if (n.includes('dừa') || n.includes('coconut')) return '🥥';
  if (n.includes('bưởi') || n.includes('grapefruit')) return '🍊';
  if (n.includes('nghệ') || n.includes('turmeric')) return '✨';
  if (n.includes('bí đao') || n.includes('winter melon')) return '🍈';
  if (n.includes('body') || n.includes('tẩy')) return '🫧';
  return '🌿';
}

function dBadge(s) {
  const m = { Pending: 'b-y', Confirmed: 'b-b', Processing: 'b-b', Shipping: 'b-b', Delivered: 'b-g', Cancelled: 'b-r', Returned: 'b-n' };
  const labels = { Pending: '⏳ Chờ xác nhận', Confirmed: '✅ Đã xác nhận', Processing: '📦 Đang chuẩn bị', Shipping: '🚚 Đang giao', Delivered: '✅ Đã giao', Cancelled: '❌ Đã hủy', Returned: '↩️ Đã hoàn' };
  return `<span class="badge ${m[s] || 'b-n'}">${labels[s] || s || '—'}</span>`;
}
function pBadge(s) {
  const m = { Paid: 'b-g', Unpaid: 'b-y', Pending: 'b-y', Refunded: 'b-r', 'Handled_by_Platform': 'b-n', Credit: 'b-b' };
  return `<span class="badge ${m[s] || 'b-n'}">${s || '—'}</span>`;
}

// ═══════════════════════════════════════════════════════════
//  AUTH
// ═══════════════════════════════════════════════════════════
function openAuth(tab = 'login') {
  openModal('Tài khoản Cocoon Vietnam', authFormHTML(tab));
}

function authFormHTML(tab) {
  return `
    <div class="auth-tabs">
      <div class="auth-tab ${tab === 'login' ? 'on' : ''}" onclick="switchAuthTab('login')">Đăng nhập</div>
      <div class="auth-tab ${tab === 'register' ? 'on' : ''}" onclick="switchAuthTab('register')">Đăng ký</div>
    </div>
    <div id="auth-err" class="err-msg"></div>
    <div id="auth-form-content">
      ${tab === 'login' ? loginFormHTML() : registerFormHTML()}
    </div>
    <div id="auth-actions" style="margin-top:14px">
      ${tab === 'login' ? loginActionsHTML() : registerActionsHTML()}
    </div>
  `;
}

function loginFormHTML() {
  return `
    <div class="fg"><label>Email</label><input type="email" id="af-email" placeholder="email@example.com" autocomplete="email"></div>
    <div class="fg"><label>Mật khẩu</label><input type="password" id="af-pw" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')submitLogin()"></div>
    <div style="margin-top:4px;margin-bottom:14px">
      <span style="font-size:12px;color:var(--muted)">Chưa có tài khoản? <a href="#" onclick="switchAuthTab('register');return false" style="color:var(--accent)">Đăng ký miễn phí</a></span>
    </div>
  `;
}
function loginActionsHTML() {
  return `<button class="btn btn-p btn-full" onclick="submitLogin()">Đăng nhập</button>`;
}

function registerFormHTML() {
  return `
    <div class="fg-row">
      <div class="fg"><label>Họ tên *</label><input id="af-name" placeholder="Nguyễn Thị A" autocomplete="name"></div>
      <div class="fg"><label>Điện thoại</label><input id="af-phone" placeholder="0901234567" autocomplete="tel"></div>
    </div>
    <div class="fg"><label>Email *</label><input type="email" id="af-email" placeholder="email@example.com" autocomplete="email"></div>
    <div class="fg-row">
      <div class="fg"><label>Mật khẩu *</label><input type="password" id="af-pw" placeholder="Ít nhất 6 ký tự" autocomplete="new-password"></div>
      <div class="fg"><label>Xác nhận MK *</label><input type="password" id="af-pw2" placeholder="Nhập lại" autocomplete="new-password"></div>
    </div>
    <div class="fg-row">
      <div class="fg"><label>Giới tính</label>
        <select id="af-gender"><option value="Female">Nữ</option><option value="Male">Nam</option><option value="Other">Khác</option></select>
      </div>
      <div class="fg"><label>Thành phố</label><input id="af-city" placeholder="TP.HCM"></div>
    </div>
    <div style="font-size:11px;color:var(--muted);margin-bottom:12px">
      Bằng cách đăng ký, bạn đồng ý với <a href="#" style="color:var(--accent)">điều khoản sử dụng</a> và <a href="#" style="color:var(--accent)">chính sách bảo mật</a> của Cocoon Vietnam.
    </div>
    <div style="margin-bottom:8px">
      <span style="font-size:12px;color:var(--muted)">Đã có tài khoản? <a href="#" onclick="switchAuthTab('login');return false" style="color:var(--accent)">Đăng nhập</a></span>
    </div>
  `;
}
function registerActionsHTML() {
  return `<button class="btn btn-p btn-full" id="reg-btn" onclick="submitRegister()">Tạo tài khoản</button>`;
}

function switchAuthTab(tab) {
  document.querySelectorAll('.auth-tab').forEach(t => t.classList.toggle('on', t.textContent.trim().includes(tab === 'login' ? 'nhập' : 'ký')));
  document.getElementById('auth-form-content').innerHTML = tab === 'login' ? loginFormHTML() : registerFormHTML();
  document.getElementById('auth-actions').innerHTML = tab === 'login' ? loginActionsHTML() : registerActionsHTML();
  const errEl = document.getElementById('auth-err');
  if (errEl) errEl.style.display = 'none';
}

async function submitLogin() {
  const email = document.getElementById('af-email')?.value?.trim();
  const pw    = document.getElementById('af-pw')?.value;
  const errEl = document.getElementById('auth-err');
  if (!email || !pw) { showAuthErr('Vui lòng điền email và mật khẩu.'); return; }

  const btn = document.querySelector('#auth-actions .btn-p');
  if (btn) { btn.textContent = 'Đang đăng nhập...'; btn.disabled = true; }

  const r = await Po('/auth/login', { email, password: pw });
  if (btn) { btn.textContent = 'Đăng nhập'; btn.disabled = false; }

  if (!r?.ok) {
    showAuthErr(r?.data?.message || 'Email hoặc mật khẩu không đúng.');
    return;
  }

  // Login success
  token = r.data.data.access_token;
  me    = r.data.data.user;
  localStorage.setItem('cocoon_sf_token', token);

  // Resolve customer_id if present in token payload
  custId = me.customer_id || null;
  if (!custId) await resolveCustomerId();

  updateHeaderUI();
  closeModal();
  toast(`Xin chào, ${me.full_name}! 👋`);
  updateLoyaltySection();
}

async function submitRegister() {
  const name  = document.getElementById('af-name')?.value?.trim();
  const email = document.getElementById('af-email')?.value?.trim();
  const pw    = document.getElementById('af-pw')?.value;
  const pw2   = document.getElementById('af-pw2')?.value;
  const phone = document.getElementById('af-phone')?.value?.trim();
  const gender= document.getElementById('af-gender')?.value;
  const city  = document.getElementById('af-city')?.value?.trim();

  if (!name)  { showAuthErr('Vui lòng nhập họ tên.'); return; }
  if (!email) { showAuthErr('Vui lòng nhập email.'); return; }
  if (!pw || pw.length < 6) { showAuthErr('Mật khẩu phải có ít nhất 6 ký tự.'); return; }
  if (pw !== pw2) { showAuthErr('Mật khẩu xác nhận không khớp.'); return; }

  const btn = document.getElementById('reg-btn');
  if (btn) { btn.textContent = 'Đang tạo tài khoản...'; btn.disabled = true; }

  const r = await Po('/auth/register', {
    full_name: name, email, password: pw,
    phone_number: phone || null, gender, city: city || null,
  });

  if (btn) { btn.textContent = 'Tạo tài khoản'; btn.disabled = false; }

  if (!r?.ok) {
    showAuthErr(r?.data?.message || 'Đăng ký thất bại. Vui lòng thử lại.');
    return;
  }

  // Register success — auto login
  token  = r.data.data.access_token;
  me     = r.data.data.user;
  custId = me.customer_id || null;
  localStorage.setItem('cocoon_sf_token', token);

  updateHeaderUI();
  closeModal();
  toast(`Chào mừng đến với Cocoon Vietnam, ${me.full_name}! 🌿`);
  updateLoyaltySection();
}

function showAuthErr(msg) {
  const el = document.getElementById('auth-err');
  if (el) { el.textContent = msg; el.style.display = 'block'; }
}

async function resolveCustomerId() {
  // Try to find customer_id via /auth/me extended, or search by email
  if (!token || !me) return;
  const r = await G('/auth/me');
  if (r?.ok) {
    me = r.data.data;
    custId = me.customer_id || null;
  }
}

function doLogout() {
  if (token) Po('/auth/logout', {}).catch(() => {});
  token = null; me = null; custId = null; loyaltyPtsToUse = 0;
  localStorage.removeItem('cocoon_sf_token');
  updateHeaderUI();
  toast('Đã đăng xuất');
  goPage('home');
}

function updateHeaderUI() {
  const guestArea = document.getElementById('guest-area');
  const userArea  = document.getElementById('user-area');
  if (me) {
    guestArea.style.display = 'none';
    userArea.style.display  = 'flex';
    document.getElementById('u-av').textContent  = INI(me.full_name);
    document.getElementById('u-name').textContent = me.full_name.split(' ').slice(-1)[0];
  } else {
    guestArea.style.display = 'flex';
    userArea.style.display  = 'none';
  }
}

async function initAuth() {
  if (!token) return;
  const r = await G('/auth/me');
  if (!r?.ok) { token = null; localStorage.removeItem('cocoon_sf_token'); return; }
  me = r.data.data;
  custId = me.customer_id || null;
  updateHeaderUI();
  updateLoyaltySection();
}

// ═══════════════════════════════════════════════════════════
//  CART
// ═══════════════════════════════════════════════════════════
function saveCart() { localStorage.setItem('cocoon_sf_cart', JSON.stringify(cart)); renderCart(); }

function addToCart(product, qty = 1) {
  const ex = cart.findIndex(i => i.id === product.product_id);
  if (ex >= 0) cart[ex].qty += qty;
  else cart.push({
    id: product.product_id,
    name: product.product_name,
    price: product.selling_price,
    qty,
    sku: product.sku,
    img: product.tags?.startsWith('img:') ? product.tags.slice(4).split('|')[0] : null,
  });
  saveCart();
  toast(`✅ Đã thêm "${product.product_name.slice(0, 30)}" vào giỏ`);
}

function changeQty(idx, delta) {
  cart[idx].qty += delta;
  if (cart[idx].qty <= 0) cart.splice(idx, 1);
  saveCart();
}
function removeItem(idx) { cart.splice(idx, 1); saveCart(); }

async function updateLoyaltySection() {
  if (!me || !custId) {
    document.getElementById('loyalty-apply-section').classList.remove('show');
    return;
  }
  // Fetch loyalty balance
  const r = await G(`/customers/${custId}`);
  if (r?.ok) {
    const pts = r.data.data.loyalty_points_balance || 0;
    const el = document.getElementById('loyalty-apply-section');
    el.classList.add('show');
    document.getElementById('pts-avail').textContent = `Bạn có: ${N(pts)} pts`;
    document.getElementById('pts-use').max = pts;
  }
}

function applyLoyalty() {
  const pts = parseInt(document.getElementById('pts-use').value) || 0;
  const max = parseInt(document.getElementById('pts-use').max) || 0;
  if (pts > max) { toast('Không đủ điểm', 'w'); return; }
  loyaltyPtsToUse = pts;
  const discount = pts * 100; // 1pt = 100đ
  document.getElementById('pts-discount-info').textContent = pts > 0 ? `Giảm ${VND(discount)} từ ${pts} điểm` : '';
  renderCart();
}

function renderCart() {
  const cnt = cart.reduce((s, i) => s + i.qty, 0);
  const sub = cart.reduce((s, i) => s + i.price * i.qty, 0);
  const discount = Math.min(loyaltyPtsToUse * 100, sub);
  const total = sub + SHIP_FEE - discount;

  // Badge
  const cntEl = document.getElementById('cart-cnt');
  if (cnt > 0) { cntEl.style.display = 'flex'; cntEl.textContent = cnt; }
  else cntEl.style.display = 'none';

  document.getElementById('cart-count-label').textContent = cnt;
  document.getElementById('cs-sub').textContent   = VND(sub);
  document.getElementById('cs-ship').textContent  = sub > 0 ? VND(SHIP_FEE) : 'Miễn phí';
  document.getElementById('cs-total').textContent = VND(total);

  const discRow = document.getElementById('cs-discount-row');
  if (discount > 0) { discRow.style.display = 'flex'; document.getElementById('cs-discount').textContent = '-' + VND(discount); }
  else discRow.style.display = 'none';

  const body = document.getElementById('cart-body');
  if (!cart.length) {
    body.innerHTML = '<div class="empty"><span class="empty-icon">🛒</span>Giỏ hàng trống</div>';
    return;
  }
  body.innerHTML = cart.map((item, i) => `
    <div class="ci">
      <div class="ci-img">${item.img ? `<img src="${item.img}" loading="lazy">` : pEmoji({ product_name: item.name })}</div>
      <div class="ci-info">
        <div class="ci-name">${item.name}</div>
        <div class="ci-price">${VND(item.price * item.qty)}</div>
        <div class="qty-ctrl">
          <button class="qty-btn" onclick="changeQty(${i},-1)">−</button>
          <span class="qty-v">${item.qty}</span>
          <button class="qty-btn" onclick="changeQty(${i},1)">+</button>
          <span class="rm-btn" onclick="removeItem(${i})" title="Xóa">🗑</span>
        </div>
      </div>
    </div>
  `).join('');
}

function toggleCart() {
  const d = document.getElementById('cart-drawer');
  const o = document.getElementById('cart-overlay');
  const open = d.classList.toggle('open');
  o.classList.toggle('open', open);
  if (open) updateLoyaltySection();
}

function goPage(page, data) {
  document.querySelectorAll('.hn[data-page]').forEach(el => el.classList.toggle('on', el.dataset.page === page));
  if (document.getElementById('cart-drawer').classList.contains('open')) toggleCart();
  setMain('<div class="loading"><div class="spin"></div></div>');
  const pages = {
    home: pgHome, catalog: () => pgCatalog(), orders: pgOrders, loyalty: pgLoyalty,
    checkout: pgCheckout, profile: pgProfile, 'order-success': () => pgOrderSuccess(data),
    'track-order': pgTrackOrder,
  };
  if (pages[page]) pages[page]();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Cache product data to avoid re-fetching for quickAdd
const prodCache = {};
async function quickAdd(id) {
  if (prodCache[id]) { addToCart(prodCache[id]); return; }
  const r = await G(`/products/public/detail/${id}`);
  if (r?.ok) { prodCache[id] = r.data.data; addToCart(prodCache[id]); }
}

function selectPM(el, val) {
  document.querySelectorAll('.pm-option').forEach(e => e.classList.remove('selected'));
  el.classList.add('selected');
  el.querySelector('input[type=radio]').checked = true;
}

async function submitOrder() {
  const addr = document.getElementById('co-addr')?.value?.trim();
  if (!addr) { toast('Vui lòng nhập địa chỉ giao hàng', 'w'); return; }

  const pm = document.querySelector('input[name=pm]:checked')?.value || 'COD';
  const city = document.getElementById('co-city')?.value || '';
  const note = document.getElementById('co-note')?.value || '';

  const body = {
    payment_method: pm,
    shipping_address: addr + (city ? `, ${city}` : ''),
    city,
    shipping_fee: SHIP_FEE,
    loyalty_points_used: loyaltyPtsToUse,
    note: note || null,
    items: cart.map(i => ({ product_id: i.id, quantity: i.qty, unit_price: i.price })),
  };

  if (me) {
    // Logged-in customer
    body.customer_id = custId;
  } else {
    // Guest checkout — need name, phone, email
    const name  = document.getElementById('co-name')?.value?.trim();
    const phone = document.getElementById('co-phone')?.value?.trim();
    const email = document.getElementById('co-email')?.value?.trim();
    if (!name)  { toast('Vui lòng nhập họ tên', 'w'); return; }
    if (!email) { toast('Vui lòng nhập email để tra cứu đơn hàng', 'w'); return; }
    body.customer_name  = name;
    body.customer_phone = phone || null;
    body.customer_email = email;
  }

  const btn = document.querySelector('#main .btn-p.btn-full[onclick*="submitOrder"]');
  if (btn) { btn.textContent = 'Đang đặt hàng...'; btn.disabled = true; }

  const r = await Po('/orders/guest', body);

  if (btn) { btn.textContent = 'Đặt hàng ngay →'; btn.disabled = false; }

  if (!r?.ok) {
    toast(r?.data?.message || 'Đặt hàng thất bại. Vui lòng thử lại.', 'e');
    return;
  }

  // Clear cart
  cart = []; loyaltyPtsToUse = 0; saveCart();
  goPage('order-success', { order: r.data.data });
}

async function pgOrders() {
  if (!me) {
    setMain(`
      <div class="empty">
        <span class="empty-icon">🔒</span>
        <p style="margin-bottom:16px">Vui lòng đăng nhập để xem đơn hàng của bạn</p>
        <div style="display:flex;gap:8px;justify-content:center">
          <button class="btn btn-p" onclick="openAuth('login')">Đăng nhập</button>
          <button class="btn btn-g" onclick="goPage('track-order')">Tra cứu bằng mã đơn</button>
        </div>
      </div>
    `);
    return;
  }

  if (!custId) await resolveCustomerId();

  // Try to find orders for this customer
  let orders = [];
  if (custId) {
    const r = await G('/orders', { customer_id: custId, limit: 30, page: 1 });
    if (r?.ok) orders = r.data.data || [];
  }

  setMain(`
    <div class="section-head">
      <div class="section-title">Đơn hàng của tôi</div>
      <button class="btn btn-g btn-sm" onclick="goPage('track-order')">🔍 Tra cứu đơn</button>
    </div>
    ${orders.length === 0
      ? `<div class="empty"><span class="empty-icon">📦</span><p style="margin-bottom:14px">Chưa có đơn hàng nào</p><button class="btn btn-p" onclick="goPage('catalog')">Bắt đầu mua sắm</button></div>`
      : orders.map(o => `
        <div class="ord-card">
          <div class="ord-hd">
            <span class="ord-num">${o.order_number}</span>
            ${dBadge(o.delivery_status)}
            ${pBadge(o.payment_status)}
            <span style="margin-left:auto;font-size:12px;color:var(--muted)">${FD(o.ordered_at)}</span>
          </div>
          <div class="ord-items">${o.items_count ? `${o.items_count} sản phẩm` : '—'}</div>
          <div class="ord-ft">
            <div style="font-size:12px;color:var(--muted)">
              ${o.shipping_address ? o.shipping_address.slice(0, 50) + (o.shipping_address.length > 50 ? '…' : '') : '—'}
            </div>
            <div>
              <div class="ord-total">${VND(o.total_amount)}</div>
              <button class="btn btn-g btn-xs" style="margin-top:4px" onclick="openOrderDetail(${o.order_id})">Chi tiết</button>
            </div>
          </div>
        </div>
      `).join('')
    }
  `);
}

async function openOrderDetail(id) {
  const r = await G(`/orders/${id}`);
  if (!r?.ok) { toast('Không tải được đơn hàng', 'e'); return; }
  const o = r.data.data;
  const steps = ['Pending', 'Confirmed', 'Processing', 'Shipping', 'Delivered'];
  const ci = steps.indexOf(o.delivery_status);

  openModal(`Chi tiết đơn ${o.order_number}`, `
    <div style="margin-bottom:14px">
      <div style="font-size:13px;font-weight:600;margin-bottom:8px">Trạng thái giao hàng</div>
      <div class="track-steps">
        ${steps.map((s, i) => {
          const labels = { Pending:'Chờ xác nhận', Confirmed:'Đã xác nhận', Processing:'Chuẩn bị', Shipping:'Đang giao', Delivered:'Đã giao' };
          return `
            <div class="ts">
              <div class="ts-dot ${i < ci ? 'done' : i === ci ? 'cur' : ''}">${i < ci ? '✓' : i + 1}</div>
              <div class="ts-label ${i === ci ? 'cur' : ''}">${labels[s]}</div>
            </div>
            ${i < steps.length - 1 ? `<div class="ts-line ${i < ci ? 'done' : ''}"></div>` : ''}
          `;
        }).join('')}
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">
      <div><div class="ii"><label>Ngày đặt</label><span>${FDT(o.ordered_at)}</span></div></div>
      <div><div class="ii"><label>Kênh bán</label><span>${o.sales_channel || '—'}</span></div></div>
      <div><div class="ii"><label>Thanh toán</label><span>${pBadge(o.payment_status)}</span></div></div>
      <div><div class="ii"><label>Tổng tiền</label><span class="fw6" style="color:var(--primary)">${VND(o.total_amount)}</span></div></div>
    </div>
    <div style="font-family:var(--font-d);font-size:13px;font-weight:600;margin-bottom:8px">Sản phẩm</div>
    <div style="border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden">
      ${(o.items || []).map(i => `
        <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border)">
          <div style="flex:1;font-size:13px">${i.product_name}</div>
          <div style="font-size:12px;color:var(--muted)">×${i.quantity}</div>
          <div class="fw6" style="font-size:13px">${VND(i.subtotal)}</div>
        </div>
      `).join('')}
    </div>
    ${o.delivery_status === 'Delivered' ? `
      <div class="alert al-i" style="margin-top:12px">
        Chưa hài lòng? <a href="#" onclick="openReturnRequest(${o.order_id},'${o.order_number}');return false">Yêu cầu hoàn hàng</a>
      </div>
    ` : ''}
  `, `<button class="btn btn-g btn-sm" onclick="closeModal()">Đóng</button>`);
}

async function openReturnRequest(orderId, orderNumber) {
  closeModal();
  await new Promise(r => setTimeout(r, 100));
  openModal(`Yêu cầu hoàn hàng — ${orderNumber}`, `
    <div class="alert al-w" style="margin-bottom:14px">
      Sau khi gửi yêu cầu, đội ngũ CSKH sẽ liên hệ trong vòng 24 giờ để hỗ trợ.
    </div>
    <div class="fg"><label>Lý do hoàn hàng *</label>
      <textarea id="ret-reason" rows="3" placeholder="Mô tả lý do bạn muốn hoàn hàng..."></textarea>
    </div>
    <div class="fg"><label>Loại yêu cầu</label>
      <select id="ret-type">
        <option value="full">Hoàn toàn bộ đơn hàng</option>
        <option value="partial">Hoàn một phần sản phẩm</option>
      </select>
    </div>
  `, `
    <button class="btn btn-g btn-sm" onclick="closeModal()">Hủy</button>
    <button class="btn btn-p btn-sm" onclick="submitReturnReq(${orderId})">Gửi yêu cầu</button>
  `);
}

async function submitReturnReq(orderId) {
  const reason = document.getElementById('ret-reason')?.value?.trim();
  if (!reason) { toast('Vui lòng nhập lý do hoàn hàng', 'w'); return; }
  const r = await Po('/returns', { order_id: orderId, return_type: document.getElementById('ret-type')?.value || 'full', reason, sales_channel: 'online' });
  if (r?.ok) { toast('Gửi yêu cầu hoàn hàng thành công! CSKH sẽ liên hệ sớm.'); closeModal(); }
  else toast(r?.data?.message || 'Gửi thất bại', 'e');
}

function pgTrackOrder() {
  setMain(`
    <div class="track-wrap">
      <div style="font-size:40px;margin-bottom:12px">🔍</div>
      <h2 style="font-family:var(--font-d);font-size:22px;margin-bottom:8px">Tra cứu đơn hàng</h2>
      <p style="color:var(--muted);font-size:13px;margin-bottom:24px">Nhập mã đơn hàng và email/số điện thoại đã đặt để xem trạng thái.</p>
      <div style="text-align:left">
        <div class="fg"><label>Mã đơn hàng *</label><input id="tr-num" placeholder="CCN-WEB-..." autocomplete="off"></div>
        <div class="fg"><label>Email hoặc số điện thoại *</label><input id="tr-contact" placeholder="email@example.com hoặc 0901234567"></div>
        <button class="btn btn-p btn-full" onclick="doTrackOrder()">Tra cứu đơn hàng</button>
      </div>
      <div id="track-result" style="margin-top:20px"></div>
    </div>
  `);
}

async function doTrackOrder() {
  const num     = document.getElementById('tr-num')?.value?.trim();
  const contact = document.getElementById('tr-contact')?.value?.trim();
  if (!num || !contact) { toast('Vui lòng điền đầy đủ thông tin', 'w'); return; }

  const btn = document.querySelector('#main .btn-p.btn-full');
  if (btn) { btn.textContent = 'Đang tra cứu...'; btn.disabled = true; }

  const isEmail = contact.includes('@');
  const r = await Po('/orders/track', {
    order_number: num,
    email: isEmail ? contact : null,
    phone: !isEmail ? contact : null,
  });

  if (btn) { btn.textContent = 'Tra cứu đơn hàng'; btn.disabled = false; }

  const res = document.getElementById('track-result');
  if (!r?.ok) {
    res.innerHTML = `<div class="alert al-d">${r?.data?.message || 'Không tìm thấy đơn hàng. Vui lòng kiểm tra lại thông tin.'}</div>`;
    return;
  }

  const o = r.data.data;
  const steps = ['Pending', 'Confirmed', 'Processing', 'Shipping', 'Delivered'];
  const ci = steps.indexOf(o.delivery_status);

  res.innerHTML = `
    <div style="background:var(--card);border:1px solid var(--card-border);border-radius:var(--r);padding:18px;text-align:left">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
        <div style="font-family:var(--font-d);font-size:16px;font-weight:600">${o.order_number}</div>
        ${dBadge(o.delivery_status)}
      </div>
      <div class="track-steps">
        ${steps.map((s, i) => {
          const labels = { Pending:'Chờ xác nhận', Confirmed:'Đã xác nhận', Processing:'Chuẩn bị', Shipping:'Đang giao', Delivered:'Đã giao' };
          return `<div class="ts"><div class="ts-dot ${i < ci ? 'done' : i === ci ? 'cur' : ''}">${i < ci ? '✓' : i + 1}</div><div class="ts-label ${i === ci ? 'cur' : ''}">${labels[s]}</div></div>${i < steps.length - 1 ? `<div class="ts-line ${i < ci ? 'done' : ''}"></div>` : ''}`;
        }).join('')}
      </div>
      <hr>
      <div style="font-size:13px;color:var(--muted);margin-bottom:6px">Giao đến: <strong style="color:var(--fg)">${o.shipping_address || '—'}</strong></div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:6px">Ngày đặt: <strong style="color:var(--fg)">${FDT(o.ordered_at)}</strong></div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:12px">Tổng tiền: <strong style="color:var(--primary)">${VND(o.total_amount)}</strong></div>
      ${o.items?.length ? `
        <div style="font-size:12px;font-weight:600;margin-bottom:8px">Sản phẩm:</div>
        ${o.items.map(i => `<div style="font-size:12px;color:var(--muted);margin-bottom:4px">• ${i.product_name} × ${i.quantity} — ${VND(i.subtotal)}</div>`).join('')}
      ` : ''}
    </div>
  `;
}

async function pgLoyalty() {
  let custData = null;
  let history  = [];

  if (me && custId) {
    const [cr, hr] = await Promise.all([G(`/customers/${custId}`), G(`/customers/${custId}/loyalty`, { limit: 10 })]);
    if (cr?.ok) custData = cr.data.data;
    if (hr?.ok) history  = hr.data.data || [];
  }

  const pts  = custData?.loyalty_points_balance || 0;
  const tier = pts >= 5000 ? 'VIP 👑' : pts >= 1000 ? 'Loyal 💚' : pts >= 200 ? 'Regular ⭐' : 'New Member';
  const nextTier    = pts >= 5000 ? null : pts >= 1000 ? { name: 'VIP', need: 5000 } : pts >= 200 ? { name: 'Loyal', need: 1000 } : { name: 'Regular', need: 200 };
  const pctToNext   = nextTier ? Math.min(100, Math.round((pts / nextTier.need) * 100)) : 100;

  setMain(`

        <div style="display:flex;gap:8px;justify-content:center">
          <button class="hero-btn hero-btn-w" onclick="openAuth('register')">Đăng ký miễn phí</button>
          <button class="hero-btn hero-btn-t" onclick="openAuth('login')">Đăng nhập</button>
        </div>

    <div class="tier-cards">
      ${[
        { name:'New Member', min:0, max:200, icon:'🌱', perks:'Tích điểm mỗi đơn hàng' },
        { name:'Regular ⭐', min:200, max:1000, icon:'🌿', perks:'Tích điểm nhanh hơn' },
        { name:'Loyal 💚', min:1000, max:5000, icon:'🍃', perks:'Giảm 5% · Freeship' },
        { name:'VIP 👑', min:5000, max:null, icon:'🌟', perks:'Ưu tiên CSKH · Quà sinh nhật' },
      ].map(t => `

async function submitUpdateProfile(custId) {
  const body = {
    full_name:    document.getElementById('pf-n')?.value,
    phone_number: document.getElementById('pf-p')?.value,
    city:         document.getElementById('pf-ci')?.value,
    address:      document.getElementById('pf-a')?.value,
  };
  // Need staff token to update customer — use the customer's own token but endpoint requires staff role
  // Workaround: display info only, direct customers to contact support for changes
  // For now, try PUT and handle gracefully
  const r = await Pu(`/customers/${custId}`, body);
  if (r?.ok) toast('Cập nhật thông tin thành công');
  else toast('Không thể tự cập nhật. Vui lòng liên hệ CSKH: support@cocoon.vn', 'w');
}

async function submitChangePW() {
  const pw  = document.getElementById('pf-pw')?.value;
  const cpw = document.getElementById('pf-cpw')?.value;
  if (!pw || pw.length < 6) { toast('Mật khẩu ít nhất 6 ký tự', 'w'); return; }
  if (pw !== cpw) { toast('Mật khẩu xác nhận không khớp', 'w'); return; }
  const r = await Pu(`/users/${me.user_id}`, { password: pw });
  if (r?.ok) toast('Đổi mật khẩu thành công');
  else toast(r?.data?.message || 'Thất bại. Bạn cần đăng nhập lại để đổi mật khẩu.', 'e');
}
